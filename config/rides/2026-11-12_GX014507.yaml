# 2026-11-12 midday (GPS clock), GX014507: side streets in daylight for driveway labelling
# (1/960 s, ISO 100-270, WB 6500, GPS 3D fix). Own configs (side_day/) so the evening and
# night runs stay unchanged; driveway labels go to side/<street>_curb.yaml.
video: GX014507.MP4
osm_json: inputs/osm/terrebonne_full_2026-10-23.json   # (c) OSM, ODbL
streets_dir: ../streets/side_day
base: _base.yaml
area: _area.yaml
prefix: side_day_
skip:                       # Terrebonne: its own config; Somerled and Monkland: arterials
  - Rue de Terrebonne
  - Avenue Somerled
  - Avenue de Monkland
grid_north_deg: -58         # NDG avenues run at ~122 / 302 deg true (OSM)
